services:
  db_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orion_db}
      POSTGRES_USER: ${POSTGRES_USER:-orion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orion_password}
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./:/exercicios:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rede_bd

  db_mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-orion_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-orion_admin_pass}
    ports:
      - "27017:27017"
    volumes:
      - dados_mongo:/data/db
      - ./:/exercicios:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rede_bd

volumes:
  dados_postgres:
  dados_mongo:

networks:
  rede_bd: