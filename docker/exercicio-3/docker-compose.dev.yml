name: conferencia-dev

services:
  api:
    build:
      context: ./api
      target: dev
    image: conferencia-api:dev
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./api/src:/app/src
    depends_on:
      - db
    networks:
      - rede_conferencia

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - dados_db:/var/lib/postgresql/data
    networks:
      - rede_conferencia

volumes:
  dados_db:

networks:
  rede_conferencia: